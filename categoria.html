<script src="products.js"></script>
<script src="script.js"></script>

<script>
  function getParam(name){
    const url = new URL(window.location.href);
    return url.searchParams.get(name);
  }

  function renderCategory(){
    const cat = getParam("cat");
    const area = document.getElementById("catProducts");
    const title = document.getElementById("catTitle");

    if(!cat){
      title.textContent = "Categoria não encontrada";
      return;
    }

    // título
    title.textContent =
      cat === 'all'
      ? 'Todos os produtos'
      : cat.charAt(0).toUpperCase() + cat.slice(1);

    // lista de produtos
    const lista =
      cat === 'all'
      ? products
      : products.filter(p => p.cat === cat);

    area.innerHTML = "";

    if(lista.length === 0){
      area.innerHTML = "<p>Nenhum produto nesta categoria.</p>";
      return;
    }

    lista.forEach(p => {
      area.innerHTML += productCardHTML(p);
    });
  }

  renderCategory();
</script>
